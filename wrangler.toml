name = "inklife-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Non-secret environment variables ──────────────────────────────────────────
[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:3000"
ADMIN_EMAILS = ""

# ─── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "inklife-db"
database_id = "local"          # Replace with real ID after: wrangler d1 create inklife-db
migrations_dir = "drizzle/migrations"

# ─── KV Namespace (rate limiting) ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local"                   # Replace with real ID after: wrangler kv namespace create RATE_LIMIT_KV
preview_id = "local"

# ─── KV Namespace (search cache, 30-day TTL) ───────────────────────────────────
[[kv_namespaces]]
binding = "SEARCH_CACHE_KV"
id = "local"                   # Replace with real ID after: wrangler kv namespace create SEARCH_CACHE_KV
preview_id = "local"

# ─── Local dev overrides ───────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── Build ─────────────────────────────────────────────────────────────────────
[build]
command = ""
